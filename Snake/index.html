<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐍 Super Snake Arcade</title>

  <!-- Google Fonts: Retro Gaming Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Archivo CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-card">
    <header class="game-header">
      <div class="header-title">
        <h1><i class="fa-solid fa-staff-snake"></i> SNAKE</h1>
      </div>
      
      <div class="header-right">
        <button id="muteBtn" class="btn-icon" title="Silenciar / Activar sonido">
          <i id="muteIcon" class="fa-solid fa-volume-high"></i>
        </button>

        <div class="scoreboard">
          <div class="score-box">
            <span class="label"><i class="fa-solid fa-trophy"></i> MAX</span>
            <span id="highScore">0</span>
          </div>
          <div class="score-box highlight">
            <span class="label"><i class="fa-solid fa-star"></i> PTS</span>
            <span id="score">0</span>
          </div>
        </div>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="360" height="360"></canvas>
      
      <!-- Overlay de Inicio -->
      <div id="startOverlay" class="overlay">
        <div class="overlay-content">
          <i class="fa-solid fa-worm start-icon"></i>
          <h2>¡SUPER SNAKE!</h2>
          <p>Usa las Flechas o WASD para moverte</p>
          <button id="startBtn" class="btn-primary">
            <i class="fa-solid fa-play"></i> INICIAR JUEGO
          </button>
        </div>
      </div>

      <!-- Overlay de Game Over -->
      <div id="gameOverOverlay" class="overlay hidden">
        <div class="overlay-content">
          <i class="fa-solid fa-skull-crossbones death-icon"></i>
          <h2>¡GAME OVER!</h2>
          <p class="final-score-badge">Puntaje: <span id="finalScore">0</span></p>
          <button id="restartBtn" class="btn-primary">
            <i class="fa-solid fa-rotate-right"></i> REINICIAR (ENTER)
          </button>
        </div>
      </div>
    </div>

    <!-- D-Pad Táctil (Se muestra automáticamente solo en móviles) -->
    <section class="touch-controls">
      <button class="dpad-btn" id="btnUp"><i class="fa-solid fa-arrow-up"></i></button>
      <div class="dpad-row">
        <button class="dpad-btn" id="btnLeft"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="dpad-btn" id="btnDown"><i class="fa-solid fa-arrow-down"></i></button>
        <button class="dpad-btn" id="btnRight"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </section>

    <footer class="game-controls">
      <p><i class="fa-solid fa-gamepad"></i> Usa <span>FLECHAS</span> / <span>WASD</span> / <span>TACTIL</span></p>
      <p><i class="fa-solid fa-keyboard"></i> <span>ENTER</span> o <span>R</span> para Reiniciar</p>
      <a href="../index.html" class="btn-primary back-btn">
        <i class="fa-solid fa-house"></i> MENU PRINCIPAL
      </a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
