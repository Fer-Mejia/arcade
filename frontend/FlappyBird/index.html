<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>
  <link rel="icon" type="image/png" href="../favicon.png">

  <!-- Google Fonts: Retro Gaming Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


  <!-- Archivo CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-card">
    <header class="game-header">
      <div class="header-title">
        <h1><i class="fa-solid fa-feather-pointed"></i> FLAPPY</h1>
      </div>
      
      <div class="header-right">
        <button id="muteBtn" class="btn-icon" title="Silenciar / Activar sonido">
          <i id="muteIcon" class="fa-solid fa-volume-high"></i>
        </button>

        <div class="scoreboard">
          <div class="score-box">
            <span class="label"><i class="fa-solid fa-trophy"></i> MAX</span>
            <span id="highScore">0</span>
          </div>
          <div class="score-box highlight">
            <span class="label"><i class="fa-solid fa-star"></i> PTS</span>
            <span id="score">0</span>
          </div>
        </div>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="360" height="480"></canvas>
      
      <!-- Overlay de Inicio -->
      <div id="startOverlay" class="overlay">
        <div class="overlay-content">
          <i class="fa-solid fa-kiwi-bird start-icon"></i>
          <h2>¡SUPER FLAPPY!</h2>
          <p>Presiona ESPACIO o haz CLIC para volar</p>
          <button id="startBtn" class="btn-primary">
            <i class="fa-solid fa-play"></i> INICIAR JUEGO
          </button>
        </div>
      </div>

      <!-- Overlay de Game Over -->
      <div id="gameOverOverlay" class="overlay hidden">
        <div class="overlay-content">
          <i class="fa-solid fa-heart-crack death-icon"></i>
          <h2>¡GAME OVER!</h2>
          <p class="final-score-badge">Puntaje: <span id="finalScore">0</span></p>
          <button id="restartBtn" class="btn-primary">
            <i class="fa-solid fa-rotate-right"></i> REINICIAR (ENTER)
          </button>
        </div>
      </div>
    </div>

    <footer class="game-controls">
      <p><i class="fa-solid fa-hand-pointer"></i> <span>ESPACIO</span> o <span>CLIC</span> para Saltar</p>
      <p><i class="fa-solid fa-keyboard"></i> <span>ENTER</span> para Empezar / Reiniciar</p>

      <button class="btn-primary back-btn" onclick="location.href='../index.html'">
        <i class="fa-solid fa-house"></i> MENU PRINCIPAL
     </button>
    </footer>
  </main>

  <!-- Archivo JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
